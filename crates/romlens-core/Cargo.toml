[package]
name = "romlens-core"
description = "Romlens core: SNES ROM loading, mapping, header parsing and view models"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
thiserror.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
ruzstd = { workspace = true, optional = true }

[features]
default = ["recording"]
# `.romrec` recordings, compressed with zstd frames by the pure-Rust ruzstd.
recording = ["dep:ruzstd"]
