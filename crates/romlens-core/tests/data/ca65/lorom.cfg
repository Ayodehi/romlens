# A 32 KB LoROM: one bank of ROM at $8000, the header at $FFC0.
MEMORY {
    ZP:     start = $0000, size = $0100, type = rw;
    RAM:    start = $0200, size = $1E00, type = rw;
    ROM:    start = $8000, size = $7FC0, type = ro, fill = yes, fillval = $FF, file = %O;
    HEADER: start = $FFC0, size = $0040, type = ro, fill = yes, fillval = $00, file = %O;
}
SEGMENTS {
    ZEROPAGE: load = ZP,     type = zp;
    BSS:      load = RAM,    type = bss;
    CODE:     load = ROM,    type = ro;
    RODATA:   load = ROM,    type = ro;
    HEADER:   load = HEADER, type = ro;
}
