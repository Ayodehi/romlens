[package]
name = "romlens-ffi"
description = "Romlens public API: UniFFI object over the core, built as an XCFramework for the macOS shell"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lib]
name = "romlens_ffi"
crate-type = ["lib", "cdylib", "staticlib"]

# The binding generators pull in uniffi's whole command line (askama, goblin,
# and more). The Swift shell and the XCFramework script need them; the Linux
# shell links this crate as a library and turns the feature off.
[features]
default = ["bindgen"]
bindgen = ["uniffi/cli"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["bindgen"]

[[bin]]
name = "uniffi-bindgen-swift"
path = "src/bin/uniffi-bindgen-swift.rs"
required-features = ["bindgen"]

[dependencies]
romlens-core = { path = "../romlens-core" }
romlens-tutor = { path = "../romlens-tutor" }
romlens-draw = { path = "../romlens-draw" }
serde_json.workspace = true
uniffi.workspace = true
thiserror.workspace = true
