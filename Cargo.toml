[workspace]
resolver = "3"
members = ["crates/*"]
# The FFI spikes are standalone packages with their own lockfiles; nested
# packages must be excluded or they break workspace resolution.
exclude = ["spikes/ffi-rows/uniffi", "spikes/ffi-rows/c-abi"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "0BSD"
rust-version = "1.85"
repository = "https://github.com/placeholder/romlens"

[workspace.dependencies]
thiserror = "2"
sha2 = "0.10"
uniffi = { version = "0.31", features = ["cli"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
