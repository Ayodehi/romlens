name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      # Development-ROM tests are skipped: ROMLENS_ROM_DIR is never set in CI.

  macos-shell:
    name: macOS shell
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: brew install xcodegen
      - run: scripts/build-xcframework.sh
      - run: swift test
        working-directory: bindings/swift/RomlensKit
      - run: xcodegen generate
        working-directory: shells/macos
      # Advisory only: the runners carry Xcode 26.6 / MacOSX26.5.sdk and the
      # app targets macOS 27, so this cannot link until the images catch up.
      # The steps above need no macOS 27 SDK, so they stay enforced — that is
      # why the flag sits on the step and not on the job.
      - run: >
          xcodebuild build test
          -project shells/macos/Romlens.xcodeproj -scheme Romlens
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
        continue-on-error: true
