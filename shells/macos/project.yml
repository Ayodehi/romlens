# XcodeGen spec for the macOS shell. `xcodegen generate` (or `make app`)
# writes Romlens.xcodeproj, which is git-ignored.
name: Romlens
options:
  bundleIdPrefix: io.github.ayodehi
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  RomlensKit:
    path: ../../bindings/swift/RomlensKit
# Signing: ad-hoc unless this Mac's Local.xcconfig names a team.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "27.0"
targets:
  Romlens:
    type: application
    platform: macOS
    sources:
      - path: Romlens
    dependencies:
      - package: RomlensKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ayodehi.Romlens
        PRODUCT_NAME: Romlens
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: Romlens/Info.plist
      properties:
        CFBundleName: Romlens
        CFBundleDisplayName: Romlens
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSPrincipalClass: NSApplication
        NSHumanReadableCopyright: "0BSD"
        LSApplicationCategoryType: public.app-category.developer-tools
        CFBundleDocumentTypes:
          - CFBundleTypeName: Romlens Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [io.github.ayodehi.romlens.project]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ProjectDocument
          - CFBundleTypeName: SNES ROM image
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [io.github.ayodehi.romlens.sfc]
            NSDocumentClass: $(PRODUCT_MODULE_NAME).ProjectDocument
          # The SPC700's execution log the recorder writes beside its
          # stream (smw.rlstream, smw.spclog): a related item, so the
          # sandbox lets the app read it once the stream was chosen.
          - CFBundleTypeName: SPC700 execution log
            CFBundleTypeRole: None
            LSItemContentTypes: [io.github.ayodehi.romlens.spclog]
            NSIsRelatedItemType: true
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.ayodehi.romlens.spclog
            UTTypeDescription: SPC700 execution log
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [spclog]
        UTExportedTypeDeclarations:
          # A tab, or a sidebar row, being dragged into the editor area
          # (docs/29); never written to disk.
          - UTTypeIdentifier: io.github.ayodehi.romlens.tab
            UTTypeDescription: Romlens tab
            UTTypeConformsTo: [public.data]
          - UTTypeIdentifier: io.github.ayodehi.romlens.project
            UTTypeDescription: Romlens Project
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [romlens]
          - UTTypeIdentifier: io.github.ayodehi.romlens.sfc
            UTTypeDescription: SNES ROM image
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [sfc, smc]
    entitlements:
      path: Romlens/Romlens.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # File › Start Live Session listens on 127.0.0.1 for the recorder
        # script's stream (romlens_core::recording::live).
        com.apple.security.network.server: true
        # The tutor reaches its provider (docs/24): Anthropic, OpenAI, or an
        # endpoint the student adds.
        com.apple.security.network.client: true
  RomlensTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: RomlensTests
    dependencies:
      - target: Romlens
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.ayodehi.RomlensTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Romlens:
    build:
      targets:
        Romlens: all
        RomlensTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [RomlensTests]
