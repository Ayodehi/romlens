[package]
name = "romlens-gtk"
description = "Romlens for Linux: GTK4 and libadwaita over the Rust core"
version = "0.1.0"
edition = "2024"
license = "0BSD"
rust-version = "1.88"
repository = "https://github.com/Ayodehi/romlens"

# Not a workspace member: it needs GTK, which macOS and Windows runners lack,
# so `cargo test --workspace` stays portable. It has its own lockfile and its
# own CI job (see the workspace Cargo.toml `exclude`).
[workspace]

[[bin]]
name = "romlens"
path = "src/main.rs"

[dependencies]
romlens-ffi = { path = "../../crates/romlens-ffi" }
adw = { package = "libadwaita", version = "0.8", features = ["v1_6"] }
gtk = { package = "gtk4", version = "0.10", features = ["v4_14"] }
pangocairo = "0.21"
async-channel = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
libsecret = "0.8.0"

[profile.release]
lto = true
codegen-units = 1
